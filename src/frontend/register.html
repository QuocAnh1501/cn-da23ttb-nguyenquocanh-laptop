
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Laptop Store</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/register.js" defer></script>
</head>

<body>
    <!-- HEADER -->
   <div id="site-header"></div>

    <main class="auth-section">
        <div class="auth-card">
            <h1>Đăng ký tài khoản</h1>
            <p>Tạo tài khoản để mua sắm tại Laptop Store.</p>

            <form id="registerForm">

                <label for="fullName">Họ và tên</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Nhập họ và tên"
                    autocomplete="name"
                    maxlength="100"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Nhập địa chỉ email"
                    autocomplete="email"
                    required
                >

                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">
                    Xác nhận mật khẩu
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    id="registerButton"
                    class="btn-primary auth-button"
                >
                    Đăng ký
                </button>

                <p id="registerMessage"
                   role="status"
                   aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Đã có tài khoản?
                <a href="login.html">Đăng nhập ngay</a>
            </p>

            <a href="index.html" class="auth-back">
                ← Quay lại trang chủ
            </a>
        </div>
    </main>
</body>
</html>
