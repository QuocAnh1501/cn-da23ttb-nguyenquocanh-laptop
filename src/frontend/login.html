
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Laptop Store</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/login.js" defer></script>
</head>
<body>
     <!-- HEADER -->
   <div id="site-header"></div>

    <main class="auth-section">
        <div class="auth-card">
            <h1>Đăng nhập</h1>
            <p>Chào mừng bạn quay lại Laptop Store!</p>

            <form id="loginForm">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                    placeholder="Nhập email"
                >

                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                    placeholder="Nhập mật khẩu"
                >

                <button
                    type="submit"
                    id="loginButton"
                    class="btn-primary auth-button"
                >
                    Đăng nhập
                </button>

                <p id="loginMessage" role="status"
                   aria-live="polite"></p>
            </form>
            <p class="auth-switch">
                Chưa có tài khoản?
                <a href="register.html">Đăng ký ngay</a>
            </p>
            <a href="index.html" class="auth-back">
                ← Quay lại trang chủ
            </a>
        </div>
    </main>
</body>
</html>
