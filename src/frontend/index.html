
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laptop Store - Laptop chính hãng</title>

    <link rel="stylesheet" href="assets/css/product-filters.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chatbot.css">
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/header-auth.js" defer></script>
    <script src="assets/js/layout.js" defer></script>
    <script src="assets/js/chatbot.js" defer></script>
</head>

<body>

    <!-- HEADER -->
   <div id="site-header"></div>

    <!-- BANNER -->
    <section class="hero">
        <div class="container hero-content">
            <div>
                <span class="eyebrow">
                    LAPTOP CHO MỌI NHU CẦU
                </span>

                <h1>
                    Tìm chiếc laptop
                    <span>phù hợp với bạn</span>
                </h1>

                <p>
                    Khám phá laptop dành cho học tập,
                    lập trình, làm việc và giải trí.
                </p>

                <a href="#products" class="btn-primary">
                    Khám phá sản phẩm
                </a>
            </div>

            <div class="hero-image" aria-hidden="true">
                💻
            </div>
        </div>
    </section>

    <!-- PRODUCT LIST -->
    <section class="products-section" id="products">
        <div class="container">

            <div class="section-heading">
                <div>
                    <span class="eyebrow">
                        SẢN PHẨM CỬA HÀNG
                    </span>
                    <h2>Danh sách laptop</h2>
                </div>

                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Tìm laptop theo tên, hãng..."
                    aria-label="Tìm kiếm laptop"
                >
            </div>


            <!-- ==================================================
                BỘ LỌC VÀ DANH SÁCH LAPTOP
                ================================================== -->
            <div class="products-layout">

                <!-- BÊN TRÁI: BỘ LỌC SẢN PHẨM -->
                <aside class="product-filters">

                    <div class="filter-header">
                        <h3>🔎 Bộ lọc sản phẩm</h3>
                        <button type="button" id="clearProductFilters">
                            Xóa lọc
                        </button>
                    </div>

                    <!-- LỌC THEO DANH MỤC -->
                    <div class="filter-group">
                        <h4>Danh mục laptop</h4>

                        <!-- Danh mục lấy tự động từ MariaDB -->
                        <div id="categoryFilterList"
                            class="filter-options">
                            <p>Đang tải danh mục...</p>
                        </div>
                    </div>

                    <!-- LỌC THEO KHOẢNG GIÁ -->
                    <div class="filter-group">

                        <h4>Khoảng giá</h4>

                        <div id="priceFilterList"
                            class="filter-options">

                            <label class="filter-option">
                                <input type="checkbox"
                                    class="filter-price"
                                    data-min="0"
                                    data-max="10000000">
                                <span>Dưới 10 triệu</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox"
                                    class="filter-price"
                                    data-min="10000000"
                                    data-max="15000000">
                                <span>10 – dưới 15 triệu</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox"
                                    class="filter-price"
                                    data-min="15000000"
                                    data-max="20000000">
                                <span>15 – dưới 20 triệu</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox"
                                    class="filter-price"
                                    data-min="20000000"
                                    data-max="30000000">
                                <span>20 – dưới 30 triệu</span>
                            </label>

                            <label class="filter-option">
                                <input type="checkbox"
                                    class="filter-price"
                                    data-min="30000000">
                                <span>Từ 30 triệu trở lên</span>
                            </label>

                        </div>
                    </div>
                </aside>

                <!-- BÊN PHẢI: DANH SÁCH LAPTOP -->
                <div class="products-results">

                    <p id="productStatus"
                    class="status-message">
                        Đang tải sản phẩm...
                    </p>

                    <div id="productList" class="product-grid">
                        <!-- JavaScript hiển thị sản phẩm -->
                    </div>

                </div>

            </div>

        </div>
    </section>
    <!-- FOOTER -->
   <div id="site-footer"></div>
    <!-- CHATBOT AI -->
  <div id="chatbot-root"></div>
</body>
</html>
